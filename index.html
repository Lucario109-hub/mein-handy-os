<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Modern Minimalist OS</title>
  <meta name="description" content="Moderne Smartphone UI — PWA Demo" />
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0b0c10">
  <style>
    :root{
      --bg-1:#0b0c10; --bg-2:#15161b;
      --muted:rgba(255,255,255,0.75);
      --accent-blue:#2f80ed; --accent-green:#30d158; --accent-orange:#ff9f0a;
      --radius:14px; --shadow:0 12px 40px rgba(0,0,0,0.6);
      --transition:220ms cubic-bezier(0.2,0.9,0.2,1);
    }
    * {box-sizing:border-box;margin:0;padding:0;font-family:Inter,system-ui,-apple-system,sans-serif}
    html,body{height:100%;background:linear-gradient(180deg,#070708 0%, #0f1013 100%);color:#fff;overflow:hidden;}
    .viewport{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .screen{
      width:100%; max-width:412px; height:100vh; max-height:920px; border-radius:34px; padding:18px;
      background:linear-gradient(180deg,var(--bg-2),#0c0d11);
      box-shadow: 0 40px 120px rgba(0,0,0,0.6);
      position:relative; overflow:hidden; display:flex;flex-direction:column;
    }

    /* Status Bar */
    .status-bar{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:rgba(255,255,255,0.02);border-radius:999px;border:1px solid rgba(255,255,255,0.03);font-size:13px;font-weight:600;color:var(--muted)}
    .status-left, .status-right{display:flex;gap:8px;align-items:center}
    .battery{display:flex;align-items:center;gap:8px}
    .battery-icon{width:22px;height:12px;border:1px solid rgba(255, 255, 255, 0.12);border-radius:3px;position:relative;background:rgba(255,255,255,0.01)}
    .battery-icon::after{content:'';position:absolute;right:-4px;top:3px;width:3px;height:6px;background:rgba(255,255,255,0.2);border-radius:1px}
    .battery-level{height:100%;background:var(--accent-green);border-radius:1px;width:100%;}

    /* Grid */
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:22px 6px 12px 6px;flex:1;align-content:start}
    .app{display:flex;flex-direction:column;align-items:center;gap:8px;background:transparent;border:none;color:inherit;cursor:pointer}
    .app:focus{outline:none}
    .icon{
      width:68px;height:68px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:22px;
      background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));border:1px solid rgba(255,255,255,0.04);
      transition:transform var(--transition),box-shadow var(--transition);
      box-shadow: 0 6px 18px rgba(0,0,0,0.6);
    }
    .icon svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .app:active .icon{transform:scale(.94)}
    .label{font-size:12px;color:var(--muted);white-space:nowrap}

    /* App Windows */
    .window{
      position:absolute;left:18px;right:18px;top:80px;bottom:28px;border-radius:18px;background:#0b0c10;border:1px solid rgba(255,255,255,0.06);
      box-shadow:var(--shadow);display:flex;flex-direction:column;transform:translateY(12px) scale(.99);opacity:0;pointer-events:none;transition:transform var(--transition),opacity var(--transition);
      z-index:40;padding:10px;
    }
    .window.show{transform:translateY(0) scale(1);opacity:1;pointer-events:auto}
    .win-header{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-bottom:1px solid rgba(255,255,255,0.04)}
    .win-title{font-weight:700;font-size:15px}
    .win-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;overflow:auto;font-size:14px;color:var(--muted);gap:10px;}
    .close{background:rgba(255,69,58,0.1);color:#ff7b72;padding:8px 12px;border-radius:10px;font-weight:700;border:none;cursor:pointer}
    
    .camera-container { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; background: #000; border-radius: 8px; overflow: hidden; position: relative; }
    #camera-stream { width: 100%; height: 100%; object-fit: cover; }
  </style>
</head>
<body>

  <div class="viewport">
    <div class="screen">
      <!-- Status Bar -->
      <div class="status-bar">
        <div class="status-left">
          <span id="live-time">00:00</span>
          <span id="live-date" style="margin-left: 6px;">Do., 15. Okt.</span>
        </div>
        <div class="status-right">
          <div class="battery">
            <span style="font-size: 11px;">86%</span>
            <div class="battery-icon"><div class="battery-level" id="bat-level"></div></div>
          </div>
        </div>
      </div>

      <!-- App Grid Buttons -->
      <div class="grid">
        <button class="app" onclick="openApp('browser-win')">
          <div class="icon" style="color: var(--accent-blue);"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg></div>
          <div class="label">Browser</div>
        </button>
        <button class="app" onclick="openApp('cam-win')">
          <div class="icon" style="color: #a8b2c1;"><svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg></div>
          <div class="label">Kamera</div>
        </button>
        <button class="app" onclick="openApp('games-win')">
          <div class="icon" style="color: #6e7c91;"><svg viewBox="0 0 24 24"><line x1="6" y1="12" x2="10" y2="12"></line><line x1="8" y1="10" x2="8" y2="14"></line><line x1="15" y1="13" x2="15.01" y2="13"></line><line x1="18" y1="11" x2="18.01" y2="11"></line><rect x="2" y="6" width="20" height="12" rx="3"></rect></svg></div>
          <div class="label">Games</div>
        </button>
        <button class="app" onclick="openApp('chat-win')">
          <div class="icon" style="color: #fff;"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg></div>
          <div class="label">Chat</div>
        </button>
        <button class="app" onclick="openApp('musik-win')">
          <div class="icon" style="color: #ff3b30;"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg></div>
          <div class="label">Musik</div>
        </button>
        <button class="app" onclick="openApp('terminal-win')">
          <div class="icon" style="color: #30d158;"><svg viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg></div>
          <div class="label">Terminal</div>
        </button>
        <button class="app" onclick="openApp('videos-win')">
          <div class="icon" style="color: var(--accent-orange);"><svg viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2"></rect></svg></div>
          <div class="label">Videos</div>
        </button>
        <button class="app" onclick="openApp('options-win')">
          <div class="icon" style="color: #8e8e93;"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></div>
          <div class="label">Optionen</div>
        </button>
      </div>

      <!-- Alle 8 App-Windows -->
      <div id="browser-win" class="window"><div class="win-header"><span class="win-title">Browser</span><button class="close" onclick="closeApp('browser-win')">X</button></div><div class="win-body"><p>Suche im Web...</p></div></div>
      
      <div id="cam-win" class="window">
        <div class="win-header"><span class="win-title">Kamera</span><button class="close" onclick="closeApp('cam-win')">X</button></div>
        <div class="win-body">
          <div class="camera-container">
            <div id="camera-error" style="display:none; color:var(--accent-orange);">Warte auf Kamera...</div>
            <video id="camera-stream" autoplay playsinline muted></video>
          </div>
        </div>
      </div>
      
      <div id="games-win" class="window"><div class="win-header"><span class="win-title">Games</span><button class="close" onclick="closeApp('games-win')">X</button></div><div class="win-body"><p>Keine Spiele installiert.</p></div></div>
      <div id="chat-win" class="window"><div class="win-header"><span class="win-title">Chat</span><button class="close" onclick="closeApp('chat-win')">X</button></div><div class="win-body"><p>Keine neuen Nachrichten.</p></div></div>
      <div id="musik-win" class="window"><div class="win-header"><span class="win-title">Musik</span><button class="close" onclick="closeApp('musik-win')">X</button></div><div class="win-body"><p>Audio-Player bereit.</p></div></div>
      
      <div id="terminal-win" class="window">
        <div class="win-header"><span class="win-title">Terminal</span><button class="close" onclick="closeApp('terminal-win')">X</button></div>
