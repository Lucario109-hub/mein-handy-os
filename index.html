<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mein Handy — Launcher</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">lucario109-hub.github.io</div>
    <button id="open-settings" aria-label="Einstellungen" class="icon-btn">⚙️</button>
  </header>

  <main class="screen">
    <div class="apps-grid" id="appsGrid">
      <div class="app" data-app="browser">
        <div class="icon browser"></div>
        <div class="label">Browser</div>
      </div>
      <div class="app" data-app="camera">
        <div class="icon camera"></div>
        <div class="label">Kamera</div>
      </div>
      <div class="app" data-app="games">
        <div class="icon games"></div>
        <div class="label">Games</div>
      </div>
      <div class="app" data-app="photos">
        <div class="icon photos"></div>
        <div class="label">Bilder</div>
      </div>
      <div class="app" data-app="music">
        <div class="icon music"></div>
        <div class="label">Musik</div>
      </div>
      <div class="app" data-app="terminal">
        <div class="icon terminal"></div>
        <div class="label">Terminal</div>
      </div>
      <div class="app" data-app="videos">
        <div class="icon videos"></div>
        <div class="label">Videos</div>
      </div>
      <div class="app" data-app="options">
        <div class="icon options"></div>
        <div class="label">Optionen</div>
      </div>
    </div>
  </main>

  <!-- App entry modal -->
  <div id="appModal" class="modal" aria-hidden="true">
    <div class="modal-card">
      <button id="closeApp" class="close">✕</button>
      <div id="appContent"></div>
    </div>
  </div>

  <!-- Settings modal -->
  <div id="settingsModal" class="modal" aria-hidden="true">
    <div class="modal-card">
      <button id="closeSettings" class="close">✕</button>
      <h2>Einstellungen</h2>

      <label class="switch-row">
        <span>Sounds</span>
        <input id="toggleSounds" type="checkbox" checked />
      </label>

      <label class="switch-row">
        <span>Gridgröße</span>
        <select id="gridSize">
          <option value="4">4 Spalten</option>
          <option value="3">3 Spalten</option>
          <option value="5">5 Spalten</option>
        </select>
      </label>

      <label class="switch-row">
        <span>Theme</span>
        <select id="themeSelect">
          <option value="dark">Dunkel</option>
          <option value="dim">Gedimmt</option>
          <option value="glass">Glas</option>
        </select>
      </label>

      <div class="settings-actions">
        <button id="saveSettings">Speichern</button>
      </div>
    </div>
  </div>

  <audio id="tapSound" preload="auto"></audio>

  <script src="app.js" defer></script>
</body>
</html>
