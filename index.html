<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Modern Minimalist OS</title>
  <meta name="description" content="Moderne Smartphone UI — PWA Demo" />
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0b0c10">
  <style>
    :root{ --bg-1:#0b0c10; --bg-2:#15161b; --muted:rgba(255,255,255,0.75); --accent-blue:#2f80ed; --accent-green:#30d158; --accent-orange:#ff9f0a; --radius:14px; --shadow:0 12px 40px rgba(0,0,0,0.5); }
    *{box-sizing:border-box;margin:0;padding:0;font-family:Inter,system-ui,-apple-system,sans-serif}
    html,body{height:100%;background:linear-gradient(180deg,#070708 0%, #0f1013 100%);color:#fff;overflow:hidden}
    .viewport{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .screen{width:100%;max-width:412px;height:100vh;max-height:920px;border-radius:34px;padding:18px;background:linear-gradient(180deg,var(--bg-2),#0c0d11);box-shadow:0 40px 120px rgba(0,0,0,0.6);position:relative}
    .status-bar{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:rgba(255,255,255,0.02);border-radius:999px;border:1px solid rgba(255,255,255,0.03);font-size:13px}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:22px 6px 12px 6px;flex:1;align-content:start}
    .app{display:flex;flex-direction:column;align-items:center;gap:8px;background:transparent;border:none;color:inherit;cursor:pointer}
    .icon{width:68px;height:68px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:22px;background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));}
    .icon svg{width:28px;height:28px;display:block}
    /* Ensure inline SVG shapes inherit the current text color so icons are visible on the dark UI */
    .icon svg, .icon svg * { fill: currentColor !important; stroke: currentColor !important; }
    .label{font-size:12px;color:var(--muted);white-space:nowrap}
    .window{position:absolute;left:18px;right:18px;top:80px;bottom:28px;border-radius:18px;background:#0b0c10;border:1px solid rgba(255,255,255,0.06);box-shadow:var(--shadow);display:flex;flex-direction:column;transform:translateY(12px) scale(.995);opacity:0;pointer-events:none;transition:all 180ms ease}
    .window.show{transform:translateY(0) scale(1);opacity:1;pointer-events:auto}
    .camera-container{width:100%;height:100%;display:flex;justify-content:center;align-items:center;background:#000;border-radius:8px;overflow:hidden;position:relative}
    #camera-stream{width:100%;height:100%;object-fit:cover}
  </style>
</head>
<body>
  <div class="viewport">
    <div class="screen">
      <div class="status-bar">
        <div class="status-left"><span id="live-time">00:00</span><span id="live-date" style="margin-left:6px">Do., 15. Okt.</span></div>
        <div class="status-right"><div class="battery"><span id="bat-percent" style="font-size:11px">86%</span><div class="battery-icon" style="width:22px;height:12px;border:1px solid rgba(255,255,255,0.08);border-radius:3px;margin-left:8px"></div></div></div>
      </div>
      <div class="grid">
        <button class="app" onclick="openApp('browser-win')" aria-controls="browser-win">
          <div class="icon" style="color:var(--accent-blue)">
            <!-- browser icon (inline SVG inheriting currentColor) -->
            <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true" focusable="false">
              <circle cx="12" cy="12" r="10" />
              <path d="M4 12h16M12 4v16" stroke-width="1.5" fill="none" />
            </svg>
          </div>
          <div class="label">Browser</div>
        </button>
        <button class="app" onclick="openApp('cam-win')" aria-controls="cam-win">
          <div class="icon" style="color:#a8b2c1">
            <!-- camera icon (inline SVG inheriting currentColor) -->
            <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true" focusable="false">
              <rect x="3" y="6" width="18" height="12" rx="2" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </div>
          <div class="label">Kamera</div>
        </button>
        <button class="app" onclick="openApp('games-win')" aria-controls="games-win"><div class="icon" style="color:#6e7c91">🎮</div><div class="label">Games</div></button>
        <button class="app" onclick="openApp('chat-win')" aria-controls="chat-win"><div class="icon" style="color:#fff">💬</div><div class="label">Chat</div></button>
        <button class="app" onclick="openApp('musik-win')" aria-controls="musik-win"><div class="icon" style="color:#ff3b30">🎵</div><div class="label">Musik</div></button>
        <button class="app" onclick="openApp('terminal-win')" aria-controls="terminal-win"><div class="icon" style="color:#30d158">🖥️</div><div class="label">Terminal</div></button>
        <button class="app" onclick="openApp('videos-win')" aria-controls="videos-win"><div class="icon" style="color:var(--accent-orange)">📺</div><div class="label">Videos</div></button>
        <button class="app" onclick="openApp('options-win')" aria-controls="options-win"><div class="icon" style="color:#8e8e93">⚙️</div><div class="label">Optionen</div></button>
      </div>

      <div id="browser-win" class="window" role="dialog" aria-hidden="true"><div class="win-header"><span class="win-title">Browser</span><button class="close" onclick="closeApp('browser-win')">X</button></div><div class="win-body">Browser content</div></div>
      <div id="cam-win" class="window" role="dialog" aria-hidden="true"><div class="win-header"><span class="win-title">Kamera</span><button class="close" onclick="closeApp('cam-win')">X</button></div><div class="win-body"><div class="camera-container"><video id="camera-stream" autoplay playsinline></video><div id="camera-error" style="position:absolute;bottom:12px;left:12px;color:#fff;display:none"></div></div></div></div>
      <div id="games-win" class="window" role="dialog" aria-hidden="true"><div class="win-header"><span class="win-title">Games</span><button class="close" onclick="closeApp('games-win')">X</button></div><div class="win-body">Games</div></div>
      <div id="chat-win" class="window" role="dialog" aria-hidden="true"><div class="win-header"><span class="win-title">Chat</span><button class="close" onclick="closeApp('chat-win')">X</button></div><div class="win-body">Chat</div></div>
      <div id="musik-win" class="window" role="dialog" aria-hidden="true"><div class="win-header"><span class="win-title">Musik</span><button class="close" onclick="closeApp('musik-win')">X</button></div><div class="win-body">Musik</div></div>
      <div id="terminal-win" class="window" role="dialog" aria-hidden="true"><div class="win-header"><span class="win-title">Terminal</span><button class="close" onclick="closeApp('terminal-win')">X</button></div><div class="win-body">Terminal</div></div>
      <div id="videos-win" class="window" role="dialog" aria-hidden="true"><div class="win-header"><span class="win-title">Videos</span><button class="close" onclick="closeApp('videos-win')">X</button></div><div class="win-body">Videos</div></div>
      <div id="options-win" class="window" role="dialog" aria-hidden="true"><div class="win-header"><span class="win-title">Optionen</span><button class="close" onclick="closeApp('options-win')">X</button></div><div class="win-body">Optionen</div></div>

    </div>
  </div>
  <script src="./app.js"></script>
</body>
</html>
